<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" width="400" height="668" role="img" aria-labelledby="hero-narrow-light-title hero-narrow-light-desc">
<title id="hero-narrow-light-title">Tri-AI: free AI models do the work, a test decides whether it counts</title>
<desc id="hero-narrow-light-desc">A request from a phone runs on a free AI model, cheapest first; a verification command then decides: exit 0 keeps the work, any other exit code reverts it.</desc>
