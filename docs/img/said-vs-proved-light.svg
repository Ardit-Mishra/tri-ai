<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-labelledby="said-vs-proved-light-title said-vs-proved-light-desc">
<title id="said-vs-proved-light-title">Agent said done versus verifier proved it</title>
<desc id="said-vs-proved-light-desc">Same free model, same day. A prose rewrite with no check deleted 387 of 389 lines and was reported as a success. A task whose result grep could check was correct, and exit 0 proved it.</desc>
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
</style>
<rect x="0.5" y="0.5" width="899" height="435" rx="12" fill="#f6f9f5" stroke="#cbd9cf"/>
<text x="24" y="46" class="s" font-size="22" fill="#0e1f15" text-anchor="start" font-weight="650">Same model, same day. The difference was a test.</text>
<rect x="24" y="72" width="416" height="316" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<path d="M24 118 V82 a10 10 0 0 1 10 -10 H430 a10 10 0 0 1 10 10 V118 Z" fill="#e9f0ea"/>
<line x1="24" y1="118" x2="440" y2="118" stroke="#a9bdb0"/>
<text x="44" y="101" class="s" font-size="16" fill="#0e1f15" text-anchor="start" font-weight="600">No check</text>
<text x="44" y="156" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">Task</text>
<text x="156" y="156" class="s" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="400">Rewrite three prose strings</text>
<text x="44" y="200" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">Check</text>
<text x="156" y="200" class="m" font-size="17" fill="#0e1f15" text-anchor="start" font-weight="400">none</text>
<text x="44" y="244" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">Agent said</text>
<text x="156" y="244" class="m" font-size="17" fill="#0e1f15" text-anchor="start" font-weight="400">success</text>
<text x="44" y="288" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">Reality</text>
<text x="156" y="288" class="m" font-size="17" fill="#b3362d" text-anchor="start" font-weight="600">−387 of 389 lines</text>
<path d="M24 332 H440 V378 a10 10 0 0 1 -10 10 H34 a10 10 0 0 1 -10 -10 Z" fill="rgba(179,54,45,0.08)"/>
<line x1="24" y1="332" x2="440" y2="332" stroke="#b3362d" stroke-opacity="0.6"/>
<path d="M47.4 354.4 L58.6 365.6 M58.6 354.4 L47.4 365.6" fill="none" stroke="#b3362d" stroke-width="2.4" stroke-linecap="round"/>
<text x="72" y="367" class="s" font-size="19" fill="#b3362d" text-anchor="start" font-weight="600">Wrong, and reported as done</text>
<rect x="460" y="72" width="416" height="316" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<path d="M460 118 V82 a10 10 0 0 1 10 -10 H866 a10 10 0 0 1 10 10 V118 Z" fill="#e9f0ea"/>
<line x1="460" y1="118" x2="876" y2="118" stroke="#a9bdb0"/>
<text x="480" y="101" class="s" font-size="16" fill="#0e1f15" text-anchor="start" font-weight="600">With a check</text>
<text x="480" y="156" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">Task</text>
<text x="592" y="156" class="s" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="400">Delete two project entries</text>
<text x="480" y="200" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">Check</text>
<text x="592" y="200" class="m" font-size="17" fill="#0e1f15" text-anchor="start" font-weight="400">grep returns empty</text>
<text x="480" y="244" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">Agent said</text>
<text x="592" y="244" class="m" font-size="17" fill="#0e1f15" text-anchor="start" font-weight="400">success</text>
<text x="480" y="288" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">Verifier</text>
<text x="592" y="288" class="m" font-size="17" fill="#11764a" text-anchor="start" font-weight="600">exit 0</text>
<path d="M460 332 H876 V378 a10 10 0 0 1 -10 10 H470 a10 10 0 0 1 -10 -10 Z" fill="rgba(17,118,74,0.10)"/>
<line x1="460" y1="332" x2="876" y2="332" stroke="#11764a" stroke-opacity="0.6"/>
<path d="M482.2 360.6 L487.3 365.6 L495.8 354.9" fill="none" stroke="#11764a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="508" y="367" class="s" font-size="19" fill="#11764a" text-anchor="start" font-weight="600">Proved by a command</text>
<text x="24" y="420" class="s" font-size="16" fill="#3b5145" text-anchor="start" font-weight="400">If no command can prove a task worked, the task does not go in the queue.</text>
</svg>
