    <rect x="48" y="155" width="155" height="104" rx="12"/><rect x="275" y="104" width="155" height="104" rx="12"/><rect x="275" y="254" width="155" height="104" rx="12"/>
    <rect x="502" y="104" width="155" height="104" rx="12"/><rect x="502" y="254" width="155" height="104" rx="12"/><rect x="729" y="155" width="155" height="104" rx="12"/><rect x="1000" y="155" width="155" height="104" rx="12"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" fill="#e6f2ff" text-anchor="middle">
    <text x="125" y="194" font-size="20" font-weight="700">Operator brief</text><text x="125" y="221" font-size="14" fill="#90a4bd">scope + constraints</text>
    <text x="352" y="143" font-size="20" font-weight="700">Research</text><text x="352" y="170" font-size="14" fill="#90a4bd">sources + context</text>
    <text x="352" y="293" font-size="20" font-weight="700">Planner</text><text x="352" y="320" font-size="14" fill="#90a4bd">contract + checks</text>
