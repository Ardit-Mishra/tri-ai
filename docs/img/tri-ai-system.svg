    <text x="579" y="293" font-size="20" font-weight="700">Brain</text><text x="579" y="320" font-size="14" fill="#90a4bd">evidence + trust</text>
    <text x="806" y="194" font-size="20" font-weight="700">Verifier</text><text x="806" y="221" font-size="14" fill="#90a4bd">exit code decides</text>
    <text x="1077" y="194" font-size="20" font-weight="700">Human gate</text><text x="1077" y="221" font-size="14" fill="#90a4bd">review before release</text>
  </g>
  <g fill="none" stroke="#4e9cff" stroke-width="3" marker-end="url(#arrow)"><path d="M203 181H263Q275 181 275 169"/><path d="M203 234H263Q275 234 275 294"/><path d="M430 156H490Q502 156 502 156"/><path d="M430 306H490Q502 306 502 306"/><path d="M657 156H717Q729 156 729 181"/><path d="M657 306H705Q729 306 729 233"/></g>
