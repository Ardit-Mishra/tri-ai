    <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#101723"/><stop offset="1" stop-color="#0a1019"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="18" fill="#070b12"/>
  <path d="M0 52H1200M0 370H1200" stroke="#203043"/>
  <text x="52" y="46" fill="#90a4bd" font-family="ui-monospace,monospace" font-size="15" letter-spacing="2">TRI-AI // GOVERNED DELIVERY LOOP</text>
