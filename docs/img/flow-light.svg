<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-labelledby="flow-light-title flow-light-desc">
<title id="flow-light-title">How a request flows through Tri-AI</title>
<desc id="flow-light-desc">Five steps: a request is sent from a phone, split into specialist tasks, each task runs on a free model, a test command checks the work, and passing work is kept while failing work is retried.</desc>
