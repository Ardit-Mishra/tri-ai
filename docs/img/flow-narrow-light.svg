<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 616" width="400" height="616" role="img" aria-labelledby="flow-narrow-light-title flow-narrow-light-desc">
<title id="flow-narrow-light-title">How a request flows through Tri-AI</title>
<desc id="flow-narrow-light-desc">Five steps: a request is sent from a phone, split into specialist tasks, each task runs on a free model, a test command checks the work, and passing work is kept while failing work is undone and tried on the next model.</desc>
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
</style>
<rect x="0.5" y="0.5" width="399" height="615" rx="12" fill="#f6f9f5" stroke="#cbd9cf"/>
<defs>
<marker id="m-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#3b5145"/></marker>
<marker id="m-ok" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#11764a"/></marker>
<marker id="m-bad" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b3362d"/></marker>
<marker id="m-warn" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#8a5a0b"/></marker>
</defs>
<rect x="16" y="16" width="368" height="104" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<circle cx="40" cy="42" r="14" fill="none" stroke="#3b5145" stroke-width="1.4"/>
<text x="40" y="48" class="m" font-size="18" fill="#3b5145" text-anchor="middle" font-weight="600">1</text>
<g transform="translate(104 68.0) scale(0.8)">
<rect x="-18" y="-32" width="36" height="64" rx="7" fill="#ffffff" stroke="#0e1f15" stroke-width="1.6"/>
<line x1="-7.0" y1="24" x2="7.0" y2="24" stroke="#3b5145" stroke-width="1.6" stroke-linecap="round"/>
<line x1="-9" y1="-16" x2="9" y2="-16" stroke="#3b5145" stroke-width="1.6" stroke-linecap="round"/>
<line x1="-9" y1="-6" x2="3" y2="-6" stroke="#3b5145" stroke-width="1.6" stroke-linecap="round"/>
</g>
<text x="152" y="48" class="s" font-size="19" fill="#0e1f15" text-anchor="start" font-weight="600">Send a request</text>
<text x="152" y="72" class="s" font-size="19" fill="#0e1f15" text-anchor="start" font-weight="600">from your phone</text>
<text x="152" y="102" class="m" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">telegram_daemon</text>
<line x1="104" y1="121" x2="104" y2="135" stroke="#3b5145" stroke-width="1.6" marker-end="url(#m-a)"/>
<rect x="16" y="136" width="368" height="104" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<circle cx="40" cy="162" r="14" fill="none" stroke="#3b5145" stroke-width="1.4"/>
<text x="40" y="168" class="m" font-size="18" fill="#3b5145" text-anchor="middle" font-weight="600">2</text>
<g transform="translate(104 188.0) scale(0.8)">
<path d="M0 -14 V0 M-26 12 V0 H26 V12 M0 0 V12" fill="none" stroke="#3b5145" stroke-width="1.6"/>
<rect x="-14" y="-32" width="28" height="18" rx="4" fill="#ffffff" stroke="#0e1f15" stroke-width="1.6"/>
<rect x="-36" y="12" width="20" height="18" rx="4" fill="#ffffff" stroke="#0e1f15" stroke-width="1.6"/>
<rect x="-10" y="12" width="20" height="18" rx="4" fill="#ffffff" stroke="#0e1f15" stroke-width="1.6"/>
<rect x="16" y="12" width="20" height="18" rx="4" fill="#ffffff" stroke="#0e1f15" stroke-width="1.6"/>
</g>
<text x="152" y="168" class="s" font-size="19" fill="#0e1f15" text-anchor="start" font-weight="600">Split into</text>
<text x="152" y="192" class="s" font-size="19" fill="#0e1f15" text-anchor="start" font-weight="600">specialist tasks</text>
<text x="152" y="222" class="m" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">decomposer</text>
<line x1="104" y1="241" x2="104" y2="255" stroke="#3b5145" stroke-width="1.6" marker-end="url(#m-a)"/>
<rect x="16" y="256" width="368" height="104" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<circle cx="40" cy="282" r="14" fill="none" stroke="#3b5145" stroke-width="1.4"/>
<text x="40" y="288" class="m" font-size="18" fill="#3b5145" text-anchor="middle" font-weight="600">3</text>
<g transform="translate(104 308.0) scale(0.8)">
<line x1="-32" y1="-14" x2="32" y2="-14" stroke="#3b5145" stroke-width="1.6"/>
<line x1="-14" y1="-32" x2="-14" y2="32" stroke="#3b5145" stroke-width="1.6"/>
<line x1="-32" y1="0" x2="32" y2="0" stroke="#3b5145" stroke-width="1.6"/>
<line x1="0" y1="-32" x2="0" y2="32" stroke="#3b5145" stroke-width="1.6"/>
<line x1="-32" y1="14" x2="32" y2="14" stroke="#3b5145" stroke-width="1.6"/>
<line x1="14" y1="-32" x2="14" y2="32" stroke="#3b5145" stroke-width="1.6"/>
<rect x="-24" y="-24" width="48" height="48" rx="6" fill="#ffffff" stroke="#0e1f15" stroke-width="1.6"/>
<rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#3b5145" stroke-width="1.6"/>
</g>
<text x="152" y="288" class="s" font-size="19" fill="#0e1f15" text-anchor="start" font-weight="600">Each task runs</text>
<text x="152" y="312" class="s" font-size="19" fill="#0e1f15" text-anchor="start" font-weight="600">on a free model</text>
<text x="152" y="342" class="m" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">worker</text>
<line x1="104" y1="361" x2="104" y2="375" stroke="#3b5145" stroke-width="1.6" marker-end="url(#m-a)"/>
<rect x="16" y="376" width="368" height="104" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<circle cx="40" cy="402" r="14" fill="none" stroke="#3b5145" stroke-width="1.4"/>
<text x="40" y="408" class="m" font-size="18" fill="#3b5145" text-anchor="middle" font-weight="600">4</text>
<g transform="translate(104 428.0) scale(0.8)">
<line x1="-36" y1="4" x2="36" y2="4" stroke="#3b5145" stroke-width="1.6"/>
<rect x="-32" y="-30" width="8" height="62" rx="2" fill="#0e1f15"/>
<rect x="24" y="-30" width="8" height="62" rx="2" fill="#0e1f15"/>
<circle cx="-28" cy="-30" r="6" fill="#0e1f15"/>
<line x1="-38" y1="32" x2="-18" y2="32" stroke="#0e1f15" stroke-width="3" stroke-linecap="round"/>
<circle cx="28" cy="-30" r="6" fill="#0e1f15"/>
<line x1="18" y1="32" x2="38" y2="32" stroke="#0e1f15" stroke-width="3" stroke-linecap="round"/>
<rect x="-26" y="0" width="52" height="8" rx="2" fill="#0e1f15"/>
</g>
<text x="152" y="408" class="s" font-size="19" fill="#0e1f15" text-anchor="start" font-weight="600">A test command</text>
<text x="152" y="432" class="s" font-size="19" fill="#0e1f15" text-anchor="start" font-weight="600">checks the work</text>
<text x="152" y="462" class="m" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">verify_command</text>
<line x1="104" y1="481" x2="104" y2="495" stroke="#3b5145" stroke-width="1.6" marker-end="url(#m-a)"/>
<rect x="16" y="496" width="368" height="104" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<circle cx="40" cy="522" r="14" fill="none" stroke="#3b5145" stroke-width="1.4"/>
<text x="40" y="528" class="m" font-size="18" fill="#3b5145" text-anchor="middle" font-weight="600">5</text>
<g transform="translate(104 548.0) scale(0.8)">
<rect x="-28" y="-32" width="56" height="64" rx="6" fill="#ffffff" stroke="#0e1f15" stroke-width="1.6"/>
<circle cx="-12" cy="-16.0" r="4" fill="#11764a"/>
<line x1="0" y1="-16.0" x2="14" y2="-16.0" stroke="#3b5145" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="-12" cy="0.0" r="4" fill="#b3362d"/>
<line x1="0" y1="0.0" x2="14" y2="0.0" stroke="#3b5145" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="-12" cy="16.0" r="4" fill="#11764a"/>
<line x1="0" y1="16.0" x2="14" y2="16.0" stroke="#3b5145" stroke-width="1.6" stroke-linecap="round"/>
</g>
<path d="M154.2 522.6 L159.3 527.6 L167.8 516.9" fill="none" stroke="#11764a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="178" y="528" class="s" font-size="19" fill="#11764a" text-anchor="start" font-weight="600">Pass: kept</text>
<path d="M155.4 540.4 L166.6 551.6 M166.6 540.4 L155.4 551.6" fill="none" stroke="#b3362d" stroke-width="2.4" stroke-linecap="round"/>
<text x="178" y="552" class="s" font-size="19" fill="#b3362d" text-anchor="start" font-weight="600">Fail: undone</text>
<text x="152" y="582" class="m" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">ledger.jsonl</text>
</svg>
