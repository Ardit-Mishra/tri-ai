<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="400" height="860" role="img" aria-labelledby="said-vs-proved-narrow-light-title said-vs-proved-narrow-light-desc">
<title id="said-vs-proved-narrow-light-title">Agent said done versus verifier proved it</title>
<desc id="said-vs-proved-narrow-light-desc">Same free model, same day. A prose rewrite with no check deleted 387 of 389 lines and was reported as a success. A task whose result grep could check was correct, and exit 0 proved it.</desc>
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
</style>
<rect x="0.5" y="0.5" width="399" height="859" rx="12" fill="#f6f9f5" stroke="#cbd9cf"/>
<text x="24" y="44" class="s" font-size="22" fill="#0e1f15" text-anchor="start" font-weight="650">Same model, same day.</text>
<text x="24" y="72" class="s" font-size="22" fill="#0e1f15" text-anchor="start" font-weight="650">The difference was a test.</text>
<rect x="16" y="96" width="368" height="336" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<path d="M16 142 V106 a10 10 0 0 1 10 -10 H374 a10 10 0 0 1 10 10 V142 Z" fill="#e9f0ea"/>
<line x1="16" y1="142" x2="384" y2="142" stroke="#a9bdb0"/>
<text x="36" y="126" class="s" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="600">No check</text>
<text x="36" y="176" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">Task</text>
<text x="36" y="200" class="s" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="400">Rewrite three prose strings</text>
<text x="36" y="228" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">Check</text>
<text x="36" y="252" class="m" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="400">none</text>
<text x="36" y="280" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">Agent said</text>
<text x="36" y="304" class="m" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="400">success</text>
<text x="36" y="332" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">Reality</text>
<text x="36" y="356" class="m" font-size="18" fill="#b3362d" text-anchor="start" font-weight="600">−387 of 389 lines</text>
<path d="M16 380 H384 V422 a10 10 0 0 1 -10 10 H26 a10 10 0 0 1 -10 -10 Z" fill="rgba(179,54,45,0.08)"/>
<line x1="16" y1="380" x2="384" y2="380" stroke="#b3362d" stroke-opacity="0.6"/>
<path d="M39.4 400.4 L50.6 411.6 M50.6 400.4 L39.4 411.6" fill="none" stroke="#b3362d" stroke-width="2.4" stroke-linecap="round"/>
<text x="64" y="413" class="s" font-size="19" fill="#b3362d" text-anchor="start" font-weight="600">Wrong, and reported as done</text>
<rect x="16" y="448" width="368" height="336" rx="10" fill="#ffffff" stroke="#a9bdb0"/>
<path d="M16 494 V458 a10 10 0 0 1 10 -10 H374 a10 10 0 0 1 10 10 V494 Z" fill="#e9f0ea"/>
<line x1="16" y1="494" x2="384" y2="494" stroke="#a9bdb0"/>
<text x="36" y="478" class="s" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="600">With a check</text>
<text x="36" y="528" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">Task</text>
<text x="36" y="552" class="s" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="400">Delete two project entries</text>
<text x="36" y="580" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">Check</text>
<text x="36" y="604" class="m" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="400">grep returns empty</text>
<text x="36" y="632" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">Agent said</text>
<text x="36" y="656" class="m" font-size="18" fill="#0e1f15" text-anchor="start" font-weight="400">success</text>
<text x="36" y="684" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">Verifier</text>
<text x="36" y="708" class="m" font-size="18" fill="#11764a" text-anchor="start" font-weight="600">exit 0</text>
<path d="M16 732 H384 V774 a10 10 0 0 1 -10 10 H26 a10 10 0 0 1 -10 -10 Z" fill="rgba(17,118,74,0.10)"/>
<line x1="16" y1="732" x2="384" y2="732" stroke="#11764a" stroke-opacity="0.6"/>
<path d="M38.2 758.6 L43.3 763.6 L51.8 752.9" fill="none" stroke="#11764a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="765" class="s" font-size="19" fill="#11764a" text-anchor="start" font-weight="600">Proved by a command</text>
<text x="24" y="818" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">If no command can prove a task worked,</text>
<text x="24" y="842" class="s" font-size="18" fill="#3b5145" text-anchor="start" font-weight="400">the task does not go in the queue.</text>
</svg>
